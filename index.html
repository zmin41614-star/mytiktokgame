<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUAD WAR LIVE</title>
    <script src="https://socket.io"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #panel {
            background-color: #111111;
            padding: 25px;
            border-radius: 12px;
            border: 3px solid #ff9900;
            text-align: center;
            width: 90%;
            max-width: 420px;
            position: absolute;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
        }
        h2 { margin-bottom: 20px; color: #ff9900; font-size: 26px; letter-spacing: 1px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #222;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        input:focus { border-color: #ff9900; outline: none; }
        #connectButton {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #ff6600, #ff9900);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #1e5631; 
            position: relative;
        }
        #divider-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: rgba(255,255,255,0.3);
            transform: translateX(-50%);
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 26px;
            font-weight: bold;
            background-color: rgba(15,32,15,0.8);
            padding: 12px 35px;
            border-radius: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            z-index: 5;
        }
        .red-team { color: #ff4444; }
        .blue-team { color: #4444ff; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div id="panel">
        <h2>SQUAD WAR LIVE</h2>
        <input type="text" id="usernameInput" placeholder="Username ရိုက်ထည့်ပါ">
        <button id="connectButton">CONNECT & START</button>
    </div>

    <div id="game-container">
        <div id="divider-line"></div>
        <div id="score-board">
            <span class="red-team">RED: <span id="redScore">0</span></span>
            <span class="blue-team">BLUE: <span id="blueScore">0</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const connectButton = document.getElementById('connectButton');
        const usernameInput = document.getElementById('usernameInput');
        const panel = document.getElementById('panel');
        const gameContainer = document.getElementById('game-container');
        const redScoreElement = document.getElementById('redScore');
        const blueScoreElement = document.getElementById('blueScore');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let redScore = 0;
        let blueScore = 0;
        let isConnected = false;
        let soldiers = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        connectButton.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            if (!username) { return; }

            panel.style.display = 'none';
            gameContainer.style.display = 'block'; 

            gameLoop();
            startTikTokConnection(username);
        });

        function startTikTokConnection(username) {
            //  ၃ ကြောင်းလင့်ခ် လမ်းကြောင်းအတိုင်း အောင်မြင်စွာ ပြောင်းလဲချိတ်ဆက်ပေးထားပါသည်
            const backendUrl = "https://workers.dev"; 

            try {
                // Cloudflare Worker ၏ တကယ့် WebSocket / Socket လမ်းကြောင်းဆီ တိုက်ရိုက်ချိတ်ဆက်ခြင်း
                const socket = io(backendUrl, { 
                    path: "/connect",
                    query: { room: username },
                    transports: ['websocket']
                });

                socket.on('connect', () => {
                    console.log("Connected to Cloudflare Worker API!");
                    isConnected = true;
                });

                socket.on('chat', (data) => {
                    if (data.comment.includes('1')) { spawnSoldier('RED'); }
                    else if (data.comment.includes('2')) { spawnSoldier('BLUE'); }
                });

                socket.on('gift', (data) => {
                    for (let i = 0; i < data.repeatCount * 5; i++) {
                        spawnSoldier(data.giftName === 'Rose' ? 'RED' : 'BLUE');
                    }
                });
            } catch (error) {
                console.error(error);
            }
        }

        function spawnSoldier(team) {
            const x = team === 'RED' ? 40 : canvas.width - 40;
            const y = Math.random() * (canvas.height - 120) + 60;
            
            soldiers.push({
                x: x, y: y, team: team, radius: 14, speed: team === 'RED' ? 2.5 : -2.5
            });

            if (team === 'RED') {
                redScore++;
                if(redScoreElement) redScoreElement.innerText = redScore;
            } else {
                blueScore++;
                if(blueScoreElement) blueScoreElement.innerText = blueScore;
            }
        }

        function updateGame() {
            for (let i = soldiers.length - 1; i >= 0; i--) {
                let s = soldiers[i];
                s.x += s.speed;
                if (s.x > canvas.width || s.x < 0) { soldiers.splice(i, 1); }
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            soldiers.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.team === 'RED' ? '#ff4444' : '#4444ff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.closePath();
            });
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
