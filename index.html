<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D TOURNAMENT ARENA - WEB SECURE EDITION</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #04060f; color: white; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        .arena { position: relative; width: 100vw; height: 100vh; display: flex; background: linear-gradient(180deg, #050a1d 0%, #03045e 70%, #023e8a 100%); perspective: 400px; }
        .red { width: 50%; height: 100%; background: rgba(255,0,85,0.04); border-right: 3px solid #ff0055; box-shadow: 0 0 15px #ff0055; }
        .blue { width: 50%; height: 100%; background: rgba(0,242,254,0.04); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: transparent; }
        .panel { position: absolute; bottom: 20px; left: 20px; width: 170px; background: rgba(0,0,0,0.95); border: 2px solid #ffcc00; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 7px; z-index: 30; }
        .panel input { width: 100%; padding: 6px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; }
        .panel button { width: 100%; padding: 6px; background: #ffcc00; color: #000; border: none; border-radius: 4px; font-weight: bold; }
        .gift-rewards-box { position: absolute; top: 15px; right: 15px; width: 195px; height: 140px; background: rgba(10, 25, 47, 0.95); border: 3px solid #00f2fe; border-radius: 4px; padding: 12px 10px; z-index: 15; font-size: 11px; box-shadow: 0 0 15px #00f2fe; }
    </style>
    <!--  HTTPS ဝဘ်ဆိုက်လုံခြုံရေးတံတားကို အပြည့်အဝကျော်ဖြတ်ပေးမည့် တရားဝင် CDN Socket Script  -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="arena" id="clickArena">
        <div class="red"></div><div class="blue"></div>
        <canvas id="arenaCanvas"></canvas>
        <div class="panel" id="setupPanel">
            <input type="text" id="usernameInput" placeholder="@username...">
            <button id="connectBtn" onclick="startConnectingEffect()">Connect.</button>
        </div>
        <div class="gift-rewards-box">
            <div style="color:#00f2fe; font-weight:bold; text-align:center; margin-bottom:10px;"> GIFT REWARDS </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span style="color:#ffeb3b;"> Light Sword</span><span style="color:#00f2fe; font-weight:bold;">x5</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span style="color:#ffeb3b;"> Rose</span><span style="color:#00f2fe; font-weight:bold;">x10</span></div>
            <div style="display:flex; justify-content:space-between;"><span style="color:#ffeb3b;"> Heart</span><span style="color:#00f2fe; font-weight:bold;">x20</span></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("arenaCanvas"); const ctx = canvas.getContext("2d");
        let soldiers = []; let rockets = []; let globalSocket = null; let audioCtx = null;
        
        //  ၃ မိနစ် Countdown + Winner အော်တို Reset စနစ် Variable များ 
        let gameTime = 180; let winnerText = ""; let isGameOver = false; let timerInterval = null;
        const flags = { red: { x: 30, y: 340, hp: 100, color: "#ff4d4d", text: " SOLDIER" }, blue: { x: 470, y: 340, hp: 100, color: "#00f2fe", text: " WARRIOR" } };
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize();
        
        function playDJRemixSound(f, t, d, v=0.18) { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e) {} }
        
        let notes = [220, 246.94, 261.63, 293.66, 329.63, 293.66, 261.63, 246.94]; let step = 0;
        function startClubDJRemix() { setInterval(() => { if(isGameOver) return; playDJRemixSound(55, 'sawtooth', 0.35, 0.45); let currentNote = notes[step % notes.length]; playDJRemixSound(currentNote, 'sawtooth', 0.22, 0.07); setTimeout(() => playDJRemixSound(180, 'square', 0.08, 0.15), 130); step++; }, 480); }
        
        function startTimer() { 
            if(timerInterval) clearInterval(timerInterval); 
            timerInterval = setInterval(() => { 
                if (gameTime > 0 && !isGameOver) { gameTime--; } 
                else if (gameTime <= 0 && !isGameOver) { 
                    isGameOver = true; 
                    winnerText = flags.red.hp === flags.blue.hp ? " DRAW MATCH! " : (flags.red.hp > flags.blue.hp ? " RED TEAM WINNER! " : " BLUE TEAM WINNER! "); 
                    playDJRemixSound(880, 'sine', 1.5, 0.4); 
                    triggerReset(); 
                } 
            }, 1000); 
        }
        function triggerReset() { setTimeout(() => { flags.red.hp = 100; flags.blue.hp = 100; soldiers = []; rockets = []; gameTime = 180; isGameOver = false; winnerText = ""; }, 5000); }
        
        function spawnSoldier(team, username) { if(isGameOver) return; let startX = team === "red" ? 45 : canvas.width - 45; let startY = Math.random() * (canvas.height - 150) + 75; soldiers.push({ x: startX, y: startY, team: team, hp: 30, radius: 15, speedX: team === "red" ? 2.2 : -2.2, speedY: (Math.random() - 0.5) * 1.5, color: team === "red" ? "#ff0055" : "#00f2fe", name: username, lastShot: 0 }); playDJRemixSound(team === "red" ? 140 : 190, 'triangle', 0.1, 0.2); }
        
        //  Secure HTTPS Cloud API ချိတ်ဆက်မှုစနစ်စစ်စစ် 
        function startConnectingEffect() {
            const username = document.getElementById("usernameInput").value.trim().toLowerCase(); if (!username) return alert("Username ထည့်ပေးပါဗျာ။");
            const btn = document.getElementById("connectBtn"); btn.style.background = "#ffcc00"; btn.innerText = "Connecting...";
            
            if (username === "tiktok") { btn.innerText = "Connected!"; btn.style.backgroundColor = "#4caf50"; btn.style.color = "#ffffff"; window.testSimInterval = setInterval(() => { spawnSoldier(Math.random() > 0.5 ? "red" : "blue", "AutoBot"); }, 950); startClubDJRemix(); startTimer(); setTimeout(() => { document.getElementById("setupPanel").style.display = "none"; }, 1500); return; }
            
            if(globalSocket) globalSocket.disconnect();
            const ioNamespace = window.io || (typeof io !== "undefined" ? io : null); if(!ioNamespace) return;
            
            //  HTTPS လုံခြုံရေးတရားဝင်ပါဝင်သော တိုက်ရိုက် API URL 
            globalSocket = ioNamespace("https://railway.app", { timeout: 9000, forceNew: true, transports: ['websocket'] }); globalSocket.emit("setUniqueId", username);
            
            //  Connect ဖြစ်သည်နှင့်တစ်ပြိုင်နက် Panel အား အော်တိုဖျောက်ခြင်း 
            globalSocket.on("connected", () => { document.getElementById("connectBtn").style.backgroundColor = "#4caf50"; document.getElementById("connectBtn").innerText = "Connected!"; startClubDJRemix(); startTimer(); setTimeout(() => { document.getElementById("setupPanel").style.display = "none"; }, 1500); });
            globalSocket.on("connect_error", () => { globalSocket.disconnect(); globalSocket = ioNamespace("https://onrender.com", { forceNew: true, transports: ['websocket'] }); globalSocket.emit("setUniqueId", username); });
            
            const evts = ["join", "like", "chat", "gift"];
            evts.forEach(e => { globalSocket.on(e, (d) => { if(!d) return; let name = d.uniqueId || "User"; if(e==="chat"){let msg=d.comment.toLowerCase().trim(); if(msg==="red")spawnSoldier("red",name); if(msg==="blue")spawnSoldier("blue",name); }else{spawnSoldier(Math.random()>0.5?"red":"blue",name);} }); });
        }
        document.getElementById("clickArena").addEventListener("click", () => { if (!audioCtx) { playDJRemixSound(440, 'sine', 0.1, 0.2); } });
        
        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i, canvas.height); ctx.lineTo(canvas.width/2, canvas.height/2 - 50); ctx.stroke(); }
            for (let i = canvas.height/2; i < canvas.height; i += 30) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
            ctx.strokeStyle = "#bd00ff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
            for (let team in flags) { let f = flags[team]; ctx.fillStyle = f.color; ctx.fillRect(f.x - 18, f.y - 45, 36, 90); ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px sans-serif"; ctx.fillText(f.text, f.x - 30, f.y - 53); ctx.fillText(`HP:${Math.round(f.hp)}`, f.x - 20, f.y + 60); }
            
            //   ၃ မိနစ် Countdown စက္ကန့်တိုင်အား နေရာမှန် ကွက်တိဆွဲပေးခြင်း  
            let mins = Math.floor(gameTime / 60); let secs = gameTime % 60;
            ctx.fillStyle = "#ffcc00"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(` TIME: ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`, canvas.width/2, 28); ctx.textAlign = "left";
            
            //   စခရင်ပေါ်တွင် WINNER အောင်ပွဲခံစာတန်းကြီးအား တောက်ပစွာဆွဲခြင်း
