<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUBBLE DROP - GALAXY NEON EDITION</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #060814; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        /*  Galaxy Battle စတိုင် Ultra-Neon Container စနစ်  */
        .main-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; padding: 12px; background: radial-gradient(circle at center, #0c0f26 0%, #050714 100%); }
        
        .game-header { width: 100%; background: linear-gradient(135deg, #1a0b36 0%, #0a1128 100%); border: 2px solid #00f2fe; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 0 15px #00f2fe, inset 0 0 10px rgba(0, 242, 254, 0.2); margin-bottom: 10px; }
        .game-title { font-size: 15px; color: #fff; text-shadow: 0 0 10px #00f2fe, 0 0 20px #bd00ff; letter-spacing: 1.5px; margin: 0; }
        .game-sub { font-size: 9.5px; color: #7b91ba; margin: 4px 0 0 0; font-family: sans-serif; font-weight: bold; }
        
        /*  Mobile Responsive Screen Perfect Fix  */
        .arena-wrapper { position: relative; width: 100%; flex-grow: 1; display: flex; border: 4px solid #ff007c; border-radius: 16px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 0, 124, 0.4); z-index: 1; }
        .red-zone { width: 50%; height: 100%; background: linear-gradient(to left, #1a050d, #0d0206); border-right: 2px dashed rgba(255, 255, 255, 0.2); }
        .blue-zone { width: 50%; height: 100%; background: linear-gradient(to right, #051026, #020714); }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100% !important; background: transparent; z-index: 2; }
        
        .score-container { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 15; pointer-events: none; }
        .score-box { font-size: 16px; padding: 6px 16px; border-radius: 6px; text-shadow: 0 0 8px #000; font-weight: bold; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .blue-score { color: #00f2fe; text-shadow: 0 0 8px #00f2fe; }
        .red-score { color: #ff007c; text-shadow: 0 0 8px #ff007c; }
        
        /*  Cyberpunk Control Panel Layout  */
        .control-panel { position: absolute; bottom: 20px; left: 20px; width: 185px; background: rgba(5, 7, 20, 0.95); border: 2px solid #00f2fe; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 30; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .control-panel input { width: 100%; padding: 8px; font-size: 11px; background: #090d1a; color: #fff; border: 1px solid #ff007c; border-radius: 6px; text-align: center; font-family: sans-serif; font-weight: bold; outline: none; }
        .control-panel input:focus { border-color: #00f2fe; box-shadow: 0 0 8px #00f2fe; }
        .control-panel button { width: 100%; padding: 8px; font-size: 11px; background: linear-gradient(90deg, #00f2fe, #bd00ff); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-shadow: 0 0 5px #000; }
        
        /*  DJ System Neon Pulse Layout  */
        .audio-pulse-indicator { width: 100%; font-size: 8.5px; color: #00f2fe; text-align: center; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; animation: pulse 1.5s infinite alternate; margin-top: 2px; }
        @keyframes pulse { 0% { opacity: 0.4; text-shadow: 0 0 2px #00f2fe; } 100% { opacity: 1; text-shadow: 0 0 8px #00f2fe, 0 0 15px #bd00ff; } }
        
        .gift-rewards-box { position: absolute; top: 15px; right: 15px; width: 195px; height: 140px; background: rgba(10, 5, 20, 0.9); border: 2px solid #ff007c; border-radius: 10px; padding: 12px 10px; z-index: 15; pointer-events: none; box-shadow: 0 0 15px rgba(255, 0, 124, 0.3); font-family: sans-serif; }
        .gift-title { font-size: 11px; color: #ff007c; text-align: center; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px; text-shadow: 0 0 5px #ff007c; }
        .gift-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #e0e0e0; }
        .gift-left { color: #ffeb3b; font-weight: bold; }
        .gift-right { color: #00f2fe; font-weight: bold; }
        
        .winners-box { position: absolute; top: 170px; right: 15px; width: 195px; height: 140px; background: rgba(5, 15, 25, 0.9); border: 2px solid #bd00ff; border-radius: 10px; padding: 12px 10px; z-index: 15; pointer-events: none; box-shadow: 0 0 15px rgba(189, 0, 255, 0.3); font-family: sans-serif; }
        .winners-title { font-size: 12px; color: #bd00ff; text-align: center; font-weight: bold; margin-bottom: 12px; text-shadow: 0 0 5px #bd00ff; }
        .winners-list { display: flex; flex-direction: column; gap: 8px; font-size: 11px; color: #fff; text-align: center; }
        .game-footer { width: 100%; text-align: center; font-size: 9px; color: #ffcc00; margin-top: 6px; font-family: sans-serif; font-weight: bold; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="main-container">
        <div class="game-header">
            <h1 class="game-title"> BUBBLE DROP: GALAXY NEON AREA </h1>
            <p class="game-sub"> Comment: RED  / BLUE  to spawn your Live Galaxy Avatars!</p>
        </div>
        <div class="arena-wrapper">
            <div class="red-zone"></div>
            <div class="blue-zone"></div>
            <canvas id="arenaCanvas" width="500" height="680"></canvas>
            <div class="score-container">
                <div class="score-box red-score" id="redScoreText">RED: 0</div>
                <div class="score-box blue-score" id="blueScoreText">BLUE: 0</div>
            </div>
            
            <div class="control-panel" id="setupPanel">
                <input type="text" id="usernameInput" placeholder="@username ရိုက်ပါ...">
                <input type="text" id="sessionIdInput" placeholder="sessionId ကုဒ်ကို Paste ချပါ...">
                <button id="connectBtn" onclick="connectTikTokNative()">Connect to Live</button>
                <div class="audio-pulse-indicator"> DJ SYSTEM // NEON STORM ACTIVE</div>
            </div>
            
            <div class="gift-rewards-box">
                <div class="gift-title"> GIFT REWARDS </div>
                <div class="gift-row"><span class="gift-left"> Light Sword</span><span class="gift-right">Spawn x5</span></div>
                <div class="gift-row"><span class="gift-left"> Rose</span><span class="gift-right">Spawn x10</span></div>
                <div class="gift-row"><span class="gift-left"> Heart</span><span class="gift-right">Spawn x20</span></div>
                <div class="gift-row"><span class="gift-left"> FingerHeart</span><span class="gift-right">Spawn x50</span></div>
            </div>
            <div class="winners-box">
                <div class="winners-title"> TOP WINNERS </div>
                <div class="winners-list" id="winnersListContainer">
                    <div style="color: #6c7a9c; font-size: 11px; font-weight: bold;">Waiting for players...</div>
                </div>
            </div>
        </div>
        <div class="game-footer">Galaxy Premium Core Architecture Engine Active </div>
    </div>

    <script>
        const canvas = document.getElementById("arenaCanvas");
        const ctx = canvas.getContext("2d");
        let soldiers = []; let globalSocket = null; let blueScore = 0; let redScore = 0; let gifterDatabase = {}; const imageCache = {};

        const fallbackServers = [
            "https://onrender.com",
            "https://railway.app"
        ];
        let currentServerIndex = 0;

        const flags = { red: { x: 30, y: 340, hp: 100, color: "#ff007c" }, blue: { x: 470, y: 340, hp: 100, color: "#00f2fe" } };

        function spawnSoldier(team, username, avatarUrl) {
            let startX = team === "red" ? 50 : 450; let startY = Math.random() * (canvas.height - 120) + 60; let img = null;
            if (avatarUrl) { if (imageCache[avatarUrl]) { img = imageCache[avatarUrl]; } else { img = new Image(); img.src = avatarUrl; img.onload = () => { imageCache[avatarUrl] = img; }; } }
            
            //  Galaxy Smooth Movement Physics Applied 
            soldiers.push({ x: startX, y: startY, team: team, hp: 35, speed: team === "red" ? 2.8 : -2.8, color: team === "red" ? "#ff007c" : "#00f2fe", size: 16, img: img, name: username });
            if(team === "red") { redScore++; document.getElementById("redScoreText").innerText = `RED: ${redScore}`; } else { blueScore++; document.getElementById("blueScoreText").innerText = `BLUE: ${blueScore}`; }
        }

        function updateWinnersUI(username, scorePoints) {
            if(!gifterDatabase[username]) gifterDatabase[username] = 0; gifterDatabase[username] += scorePoints;
            let sorted = Object.entries(gifterDatabase).sort((a,b) => b - a).slice(0, 3); const container = document.getElementById("winnersListContainer"); container.innerHTML = "";
            sorted.forEach(([name, val], idx) => { container.innerHTML += `<div style="margin-bottom:4px; font-weight: bold; color: #fff;"> Rank ${idx+1}: ${name} (${val} pts)</div>`; });
        }

        function connectTikTokNative() {
            const username = document.getElementById("usernameInput").value.trim();
            const sessionid = document.getElementById("sessionIdInput").value.trim();
            if (!username) return alert("Username ထည့်ပေးပါဗျာ။");
